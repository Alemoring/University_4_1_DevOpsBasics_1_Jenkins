services:

  backend-test:
    build: ./backend
    command: pytest

  backend-dev:
    build: ./backend
    container_name: fastapi_backend_dev
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend-dev:
    image: node:20
    container_name: react_frontend_dev
    working_dir: /app
    volumes:
      - ./client/my-app:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:5173"